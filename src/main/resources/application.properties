spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rush_jewels?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.test-while-idle=true
spring.datasource.hikari.test-on-borrow=true
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-init-sql=SET SESSION wait_timeout=28800

# Server configuration
server.port=${PORT:8080}
server.tomcat.connection-timeout=60s
server.tomcat.accesslog.enabled=true
server.server-header=VeloraJewellery
spring.mvc.async.request-timeout=60000
server.error.whitelabel.enabled=false
server.error.path=/error
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.enabled=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Logging
logging.level.root=INFO
logging.level.lk.dio.rush_jewels=INFO
logging.level.org.springframework.security=WARN

# ========== EMAIL (Namecheap Private Email SMTP) ==========
spring.mail.host=mail.privateemail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@velorajewellery.com}
spring.mail.password=${MAIL_PASSWORD:your_mail_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=mail.privateemail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ========== EMAIL ADDRESSES ==========
app.email.from=noreply@velorajewellery.com
app.email.support=support@velorajewellery.com
app.email.info=info@velorajewellery.com
app.email.display-name=Velora Fine Jewellery

# Application Base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ========== CLOUDINARY CONFIGURATION ==========
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ========== File Upload Limits ==========
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ========== OAuth Configuration ==========
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:your_facebook_client_id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:your_facebook_client_secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8080/login/oauth2/code/facebook}

# ========== PayHere Configuration ==========
payhere.merchant.id=${PAYHERE_MERCHANT_ID:your_merchant_id}
payhere.secret.key=${PAYHERE_SECRET_KEY:your_payhere_secret}
payhere.currency=LKR
payhere.sandbox=true
payhere.return.url=${APP_BASE_URL:http://localhost:8080}/order-confirmation.html
payhere.cancel.url=${APP_BASE_URL:http://localhost:8080}/payment-cancel.html
payhere.notify.url=${APP_BASE_URL:http://localhost:8080}/api/order/notify

# Jackson Timezone
spring.jackson.time-zone=Asia/Colombo

# Gemini API Key
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key}

# ========== Security Loop Fix ==========
spring.security.filter.dispatcher-types=request,async,error,forward
spring.main.lazy-initialization=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration