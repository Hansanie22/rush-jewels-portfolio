<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/favicon.png?v=7">
    <link rel="icon" type="image/png" href="/favicon.png?v=7">
    <title>Forgot Password - Velora Fine Jewellery</title>
    <meta name="description"
          content="Reset your password securely at Velora Fine Jewellery. Enter your registered email to receive a reset link.">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .sharp-input {
            border-radius: 0 !important;
        }

        .sharp-button {
            border-radius: 0 !important;
        }

        input:focus {
            border-color: #D4AF37;
        }
    </style>

    <!-- Google Fonts (Merged) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom Tailwind Config (Merged) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Updated Color Palette
                        'gold': '#C5A065',
                        'dark': '#111111',
                        'light-gray': '#F8F8F8',
                        // Brand Colors
                        brand: {
                            gold: '#C5A065',
                            dark: '#111111',
                            light: '#F9F8F4',
                            muted: '#666666',
                        }
                    },
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'serif'],
                        'montserrat': ['"Montserrat"', 'sans-serif'],
                    },
                    spacing: {
                        '128': '32rem',
                    }
                }
            }
        }
    </script>
</head>

<body class="font-poppins text-dark bg-white">

<script src="js/loader.js"></script>

<main id="main-content" style="display: none;">
<!-- Page Header -->
<div class="bg-light-gray py-6 sm:py-8">
    <div class="container mx-auto px-4">
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-playfair font-bold">Forgot Password</h1>
        <div class="flex items-center mt-2 text-gray-600 text-sm sm:text-base">
            <a href="index.html" class="hover:text-gold transition-colors">Home</a>
            <i class="fas fa-chevron-right mx-2 text-xs"></i>
            <span>Forgot Password</span>
        </div>
    </div>
</div>

<!-- Forgot Password Form -->
<div class="container mx-auto px-4 py-12">
    <div class="max-w-sm sm:max-w-md mx-auto bg-white p-6 sm:p-8">
        <h2 class="text-xl sm:text-2xl font-playfair font-bold mb-6 text-center">Reset Your Password</h2>
        <p class="text-gray-600 text-sm mb-6 text-center">Enter your registered email address below and we'll send you a
            link to reset your password.</p>

        <div id="forgot-password-form">
            <div class="mb-5">
                <label for="email" class="block text-sm font-medium mb-2">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com"
                       class="sharp-input w-full border border-gray-300 px-3 py-2.5 sm:py-3 focus:outline-none focus:border-gold"
                       required>
            </div>

            <button type="button" onclick="sendResetLink()"
                    class="sharp-button w-full bg-gold text-white py-2.5 sm:py-3 text-sm sm:text-base font-medium hover:bg-opacity-90 transition-colors">
                Send Reset Link
            </button>
        </div>

        <div class="text-center mt-4 text-sm text-gray-600">
            <p>Remembered your password? <a href="auth.html" class="text-gold hover:text-gold-dark">Back to Login</a>
            </p>
        </div>
    </div>
</div>
</main>

<!-- Footer -->
<div id="footer-container"></div>

<!-- Back to Top Component -->
<div id="backtotop-container"></div>
<script>
    // Prevent navbar from loading on this page
    window.skipNavbarLoad = true;
</script>
<script src="js/main.js"></script>
<script src="js/animations.js"></script>

<!-- Script -->

<script src="/js/components.js"></script>
<script type="module" src="js/forgot-password.js"></script>
<script>
    // 1. components.js මඟින් එන Navbar එක පූරණය වීම මෙයින් වළක්වයි
    window.skipNavbarLoad = true;

    document.addEventListener('DOMContentLoaded', async () => {
        // 2. ලෝඩරය පෙන්වීම
        if (window.loader) window.loader.show();

        try {
            // 3. Footer (Categories සමඟ) සහ අනෙකුත් කොටස් පූරණය වන තෙක් බලා සිටීම
            if (window.componentLoader) {
                await window.componentLoader.loadAllComponents();
            }
        } catch (error) {
            console.error("Layout components failed:", error);
        }

        // 4. සියල්ල අවසන් වූ පසු Content එක පෙන්වා ලෝඩරය අයින් කිරීම
        // සටහන: ඔබේ forgot-password.js ගොනුවේ revealContent() ශ්‍රිතය අර්ථ දක්වා තිබිය යුතුය.
        if (typeof revealContent === 'function') {
            revealContent();
        } else {
            // Fallback: Reveal function එක නැතිනම් කෙලින්ම Content එක පෙන්වයි
            const main = document.getElementById('main-content');
            if (main) main.style.display = 'block';
            if (window.loader) window.loader.hide();
        }
    });
</script>
</body>
</html>
