<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="apple-touch-icon" href="/favicon.png?v=2026">
    <link rel="icon" type="image/png" href="/favicon.png?v=2026">
    <title>Collections - Velora Fine Jewellery</title>
    <meta name="description" content="Explore the Velora Fine Jewellery collection with premium rings, necklaces, earrings, and more.">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Updated Color Palette
                        'gold': '#C5A065',
                        'dark': '#111111',
                        'light-gray': '#F8F8F8',
                        // Brand Colors
                        brand: {
                            gold: '#C5A065',
                            dark: '#111111',
                            light: '#F9F8F4',
                            muted: '#666666',
                        }
                    },
                    fontFamily: {
                        'playfair': ['"Playfair Display"', 'serif'],
                        'montserrat': ['"Montserrat"', 'sans-serif'],
                    },
                    spacing: {
                        '128': '32rem',
                    }
                }
            }
        }
    </script>
</head>

<body class="font-poppins text-dark bg-white">
<!-- Navbar Container -->
<div id="navbar-container"></div>

<main id="main-content" style="display: none;">
<!-- Header -->
<div class="bg-light-gray py-12">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl md:text-4xl font-playfair font-bold">Our Exclusive Collections</h1>
        <div class="flex items-center mt-2 text-gray-600">
            <a href="index.html" class="hover:text-gold">Home</a>
            <i class="fas fa-chevron-right mx-2 text-sm"></i>
            <span>Collections</span>
        </div>
    </div>
</div>

<!-- Main Content with Sidebar -->
<div class="container mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row gap-6">

        <!-- Sidebar -->
        <div id="filters-sidebar" class="md:w-1/4 mb-8 md:mb-0 hidden md:block z-50">
            <div class="bg-white p-6 shadow-md mb-6 filters-panel border border-gray-100 h-full overflow-y-auto">

                <!-- Mobile Close Button -->
                <div class="flex items-center justify-between mb-4 md:hidden">
                    <span class="text-base font-semibold uppercase tracking-wide text-gray-900">Filters</span>
                    <button id="mobile-filter-close" type="button" class="text-gray-500 hover:text-black">
                        <i class="fas fa-times text-lg"></i>
                    </button>
                </div>

                <h3 class="text-xl font-playfair font-bold mb-6 hidden md:block">Filter Collections</h3>

                <!-- Search Filter -->
                <div class="mb-8">
                    <h4 class="font-semibold mb-3">Search</h4>
                    <div class="relative">
                        <input type="text" id="collection-search-input"
                               class="w-full border border-gray-300 py-2 px-3 pr-8 focus:outline-none focus:border-gold text-sm"
                               placeholder="Search collections...">
                        <span class="absolute right-3 top-2.5 text-gray-400"><i class="fas fa-search"></i></span>
                    </div>
                </div>

                <!-- Price Range Filter -->
                <div class="mb-6">
                    <h4 class="font-semibold mb-3">Price Range</h4>
                    <div class="mb-3">
                        <input type="range" id="price-range" min="0" max="2000000" step="10000" value="2000000" class="w-full accent-gold">
                    </div>
                    <div class="flex justify-between text-sm text-gray-600">
                        <span>LKR 0</span>
                        <span id="price-value">LKR 2,000,000</span>
                    </div>
                </div>

                <button id="clear-filters" class="w-full mt-4 border border-gray-300 text-gray-700 py-2 font-medium hover:border-gold hover:text-gold transition-colors text-sm">
                    Clear All Filters
                </button>
                <button id="apply-filters"
                        class="w-full bg-gold text-white py-2 rounded-none font-medium hover:bg-opacity-90 transition-colors mt-2">
                    Apply Filters
                </button>
            </div>
        </div>

        <!-- Right Content -->
        <div class="md:w-3/4">

            <!-- Mobile Filter/Sort Bar -->
            <div class="mb-6">
                <div class="flex items-center justify-between gap-3 md:hidden">
                    <button id="filter-toggle" type="button" class="flex items-center justify-center gap-2 px-4 py-2 bg-white border border-gray-200 text-sm font-medium text-gray-800 shadow-sm hover:border-gold hover:text-gold transition-colors">
                        <i class="fas fa-sliders-h"></i> <span>Filters</span>
                    </button>
                    <div class="relative flex-1">
                        <button id="sort-toggle" type="button"
                                class="w-full flex items-center justify-between border border-gray-200 px-4 py-2 text-sm font-medium text-gray-800 bg-white shadow-sm hover:border-gold hover:text-gold transition-colors">
                            <span id="sort-toggle-label" class="flex-1 text-left truncate">Best Selling</span>
                            <i class="fas fa-chevron-down text-gray-500 ml-2"></i>
                        </button>
                        <select id="sort-select" class="sr-only">
                            <option value="popularity">Best Selling</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="newest">Newest First</option>
                        </select>
                    </div>
                </div>

                <!-- Desktop Sort Bar -->
                <div class="hidden md:flex justify-between items-center mt-0 pb-4 border-b border-gray-100">
                    <p class="text-gray-600 text-sm" id="collection-count">Loading collections...</p>
                    <div class="flex items-center gap-3">
                        <span class="text-gray-600 text-sm">Sort by:</span>
                        <select id="sort-select-desktop" class="border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:border-gold cursor-pointer">
                            <option value="popularity">Popularity</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="newest">Newest First</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-8" id="collections-grid">
                <!-- Content injected via JS -->
            </div>

            <div id="no-results" class="hidden text-center py-12">
                <div class="text-gray-300 text-6xl mb-4"><i class="far fa-folder-open"></i></div>
                <p class="text-xl text-gray-600">No collections found matching your criteria.</p>
                <button class="mt-4 text-gold hover:underline cursor-pointer" id="no-results-reset">Clear Filters</button>
            </div>

            <!-- Pagination -->
            <div class="flex justify-center mt-12" id="pagination-wrapper">
                <nav class="flex items-center flex-wrap gap-2 justify-center" id="pagination-nav"></nav>
            </div>
        </div>
    </div>
</div>

<div id="mobile-sheet-overlay" class="mobile-sheet-overlay"></div>

<!-- Mobile Sort Sheet Panel -->
<div id="mobile-sort-sheet" class="mobile-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="mobile-sort-title">
    <div class="sort-sheet-content">
        <div class="flex items-center justify-between mb-6 md:hidden">
            <span id="mobile-sort-title" class="text-base font-semibold uppercase tracking-wide text-gray-900">Sort by</span>
            <button id="mobile-sort-close" type="button" class="text-2xl text-gray-600 nav-hover" aria-label="Close sort options">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="sort-sheet-body">
            <ul id="mobile-sort-options" class="sort-option-list"></ul>
        </div>
    </div>
</div>
</main>
<!-- Footer Container -->
<div id="footer-container"></div>

<!-- Back to Top Component -->
<div id="backtotop-container"></div>

<!-- Scripts -->
<script src="js/main.js"></script>
<script src="js/animations.js"></script>
<script src="js/loader.js"></script>
<script type="module" src="/js/cart.js"></script>
<script type="module" src="/js/search.js"></script>

<!-- ✅ 1. Components Loader (Removed navbar.js to prevent conflicts) -->
<script type="module" src="/js/navbar.js"></script>
<script src="/js/components.js"></script>

<!-- ✅ 2. Sort Toggle Label Update Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Update sort toggle label when sort changes
        function updateSortToggleLabel() {
            const sortToggleLabel = document.getElementById('sort-toggle-label');
            const sortSelect = document.getElementById('sort-select');
            const sortSelectDesktop = document.getElementById('sort-select-desktop');

            if (sortToggleLabel && sortSelectDesktop) {
                const selectedOption = sortSelectDesktop.options[sortSelectDesktop.selectedIndex];
                sortToggleLabel.textContent = selectedOption.text;
            }
        }

        // Listen for sort changes
        const sortSelectDesktop = document.getElementById('sort-select-desktop');
        if (sortSelectDesktop) {
            sortSelectDesktop.addEventListener('change', updateSortToggleLabel);
        }

        // Render sort options when opening sort sheet
        const sortToggle = document.getElementById('sort-toggle');
        if (sortToggle) {
            sortToggle.addEventListener('click', () => {
                if (typeof window.renderSortOptions === 'function') {
                    setTimeout(() => window.renderSortOptions(), 50);
                }
            });
        }

        // Initialize label
        updateSortToggleLabel();
    });
</script>
<!-- ✅ 2. Safety Script to Ensure Loading -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // If components.js didn't trigger automatically, trigger it here manually
        if (window.componentLoader && typeof window.componentLoader.loadAllComponents === 'function') {
            window.componentLoader.loadAllComponents();
        }
    });
</script>

<!-- Main Collection Logic -->
<script type="module" src="js/collection.js"></script>
<script src="js/flying-animation.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. ලෝඩරය පෙන්වීම (එක් වරක් පමණයි)
        if (window.loader) window.loader.show();

        try {
            // 2. Navbar/Footer සහ දත්ත එකවර ලෝඩ් කිරීම
            await Promise.all([
                window.componentLoader ? window.componentLoader.loadAllComponents() : Promise.resolve(),
                window.fetchCollections ? window.fetchCollections() : Promise.resolve()
            ]);

        } catch (error) {
            console.error("Collections page error:", error);
        } finally {
            // 3. ✅ සියල්ල අවසන් වූ පසු පමණක් පිටුව පෙන්වා ලෝඩරය අයින් කිරීම
            if (typeof window.revealCollectionsPage === 'function') {
                window.revealCollectionsPage();
            } else {
                // Fallback
                const main = document.getElementById('main-content');
                if (main) main.style.display = 'block';
                if (window.loader) window.loader.hide();
            }
        }
    });
</script>
</body>
</html>
