# Nginx config for RUSH JEWELS on Bluehost VPS
# File location on server: /etc/nginx/sites-available/rush-jewels
#
# To enable: sudo ln -s /etc/nginx/sites-available/rush-jewels /etc/nginx/sites-enabled/
# To test:   sudo nginx -t
# To reload: sudo systemctl reload nginx
#
# ⚠️ Replace 129.121.78.119 with your actual domain when you get one
# ⚠️ For HTTPS with domain: run "sudo certbot --nginx -d yourdomain.com"

# --- RATE LIMITING & SECURITY ---
# Limit requests to 10 per second per IP (burst up to 20 for assets) to prevent DDoS
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

# --- LOAD BALANCING (Upstream cluster) ---
# Running 3 instances of Spring Boot (ports 8080, 8081, 8082)
upstream rush_jewels_backend {
    # ip_hash; # Use ip_hash if session stickiness is needed without Redis
    server 127.0.0.1:8083 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8081 weight=1 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8082 weight=1 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    # Change this to your domain when available:
    # server_name rushjewels.lk www.rushjewels.lk;
    server_name 129.121.78.119;

    # --- SECURITY HEADERS (Prevent Console/Browser Hacks) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy can be strict, adjusting to allow standard resources
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Increase upload size for product images
    client_max_body_size 100M;

    # Access & error logs
    access_log /var/log/nginx/rush_jewels_access.log;
    error_log  /var/log/nginx/rush_jewels_error.log;

    # Proxy all requests to Spring Boot Cluster
    location / {
        limit_req zone=mylimit burst=20 nodelay;

        # Send traffic to the upstream cluster instead of a single port
        proxy_pass         http://rush_jewels_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts (Crucial for high load)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings
        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml;
}
